<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="eymployeee">
  <meta name="theme-color" content="#E8D5D2">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="manifest" href="manifest.json">

  <title>eymployeee</title>
  <style>
    :root {
      color-scheme: light;
      --bg-top: #f8e5e0;
      --bg-mid: #d4e4f7;
      --bg-bottom: #e6ddf5;
      --card-top: rgba(255, 252, 250, 0.94);
      --card-bottom: rgba(255, 244, 234, 0.9);
      --stroke: rgba(187, 163, 199, 0.72);
      --text-main: #374151;
      --text-soft: #5d697c;
      --accent: #b4a7d6;
      --accent-strong: #9cadce;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 18% 22%, rgba(248, 199, 180, 0.48), transparent 25%),
        radial-gradient(circle at 84% 78%, rgba(168, 218, 220, 0.42), transparent 22%),
        linear-gradient(135deg, var(--bg-top), var(--bg-mid), var(--bg-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      overflow: hidden;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 22%, rgba(248, 199, 180, 0.48), transparent 25%),
        radial-gradient(circle at 84% 78%, rgba(168, 218, 220, 0.42), transparent 22%),
        linear-gradient(135deg, var(--bg-top), var(--bg-mid), var(--bg-bottom));
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    #app-loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      width: min(100%, 340px);
      padding: 28px 24px 22px;
      border-radius: 28px;
      border: 1px solid var(--stroke);
      background: linear-gradient(180deg, var(--card-top), var(--card-bottom));
      box-shadow:
        0 24px 60px rgba(93, 107, 140, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.75);
      text-align: center;
    }

    .loader-icon-shell {
      width: 92px;
      height: 92px;
      margin: 0 auto 18px;
      border-radius: 28px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #fff4ea, #d4e4f7, #e6ddf5);
      border: 1px solid var(--stroke);
      box-shadow: 0 12px 32px rgba(93, 107, 140, 0.18);
    }

    .loader-icon {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(93, 107, 140, 0.2);
    }

    .loader-title {
      margin: 0;
      color: var(--text-main);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .loader-subtitle {
      margin: 10px 0 18px;
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.45;
    }

    .loader-bar {
      position: relative;
      width: 100%;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(187, 163, 199, 0.22);
    }

    .loader-bar::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: -42%;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      box-shadow: 0 0 18px rgba(180, 167, 214, 0.36);
      animation: loader-slide 1.15s ease-in-out infinite;
    }

    .loader-footnote {
      margin: 14px 0 0;
      color: rgba(93, 105, 124, 0.74);
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    @keyframes loader-slide {
      0% {
        left: -42%;
      }
      100% {
        left: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="app-loader" aria-live="polite" aria-label="Loading eymployeee">
    <div class="loader-card">
      <div class="loader-icon-shell">
        <img class="loader-icon" src="icons/Icon-192.png" alt="eymployeee app icon" />
      </div>
      <p class="loader-title">eymployeee</p>
      <p class="loader-subtitle">근무 기록과 급여 계산을 준비하고 있어요.</p>
      <div class="loader-bar"></div>
      <p class="loader-footnote">Loading your wage workspace...</p>
    </div>
  </div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var loader = document.getElementById("app-loader");
      if (loader) {
        loader.classList.add("is-hidden");
        window.setTimeout(function () {
          loader.remove();
        }, 320);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
